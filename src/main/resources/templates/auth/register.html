<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員登録 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">会員登録</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/auth/register}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">お名前</label>
                            <input type="text" id="name" name="name"
                                   class="form-control" placeholder="山田 太郎" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">メールアドレス</label>
                            <input type="email" id="email" name="email"
                                   class="form-control" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" id="password" name="password"
                                   class="form-control" placeholder="8文字以上" required minlength="8">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">登録する</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center text-muted">
                    すでにアカウントをお持ちの方は
                    <a th:href="@{/auth/login}">ログイン</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
