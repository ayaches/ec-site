<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">ログイン</h4>
                </div>
                <div class="card-body p-4">

                    <!-- ログインエラー -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        メールアドレスまたはパスワードが正しくありません。
                    </div>
                    <!-- ログアウト成功 -->
                    <div th:if="${param.logout}" class="alert alert-info">
                        ログアウトしました。
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">メールアドレス</label>
                            <input type="email" id="username" name="username"
                                   class="form-control" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" id="password" name="password"
                                   class="form-control" placeholder="パスワード" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">ログイン</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center text-muted">
                    アカウントをお持ちでない方は
                    <a th:href="@{/auth/register}">会員登録</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
