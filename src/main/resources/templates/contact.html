<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせ | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <!-- 送信完了メッセージ -->
            <div th:if="${param.sent}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>送信完了！</strong> お問い合わせありがとうございます。内容を確認の上、ご連絡いたします。
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">お問い合わせ</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/contact}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">お名前 <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name"
                                   class="form-control" placeholder="山田 太郎" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
                            <input type="email" id="email" name="email"
                                   class="form-control" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="message" class="form-label">お問い合わせ内容 <span class="text-danger">*</span></label>
                            <textarea id="message" name="message"
                                      class="form-control" rows="6"
                                      placeholder="お問い合わせ内容をご記入ください" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">送信する</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center text-muted">
                    <a th:href="@{/products}">← 商品一覧に戻る</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
