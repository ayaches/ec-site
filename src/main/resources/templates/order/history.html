<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>注文履歴 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <h2 class="mb-4">注文履歴</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
        <p class="text-muted">注文履歴がありません。</p>
        <a th:href="@{/products}" class="btn btn-primary">商品一覧へ</a>
    </div>

    <table th:unless="${#lists.isEmpty(orders)}" class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>注文番号</th>
            <th class="text-end">合計金額</th>
            <th class="text-center">ステータス</th>
            <th>注文日時</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="'#' + ${order.id}"></td>
            <td class="text-end fw-bold"
                th:text="'¥' + ${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')}"></td>
            <td class="text-center">
                <span class="badge bg-warning text-dark" th:text="${order.status}"></span>
            </td>
            <td th:text="${#temporals.format(order.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
