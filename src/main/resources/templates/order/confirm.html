<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>注文確認 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4" style="max-width: 700px;">
    <h2 class="mb-4">注文確認</h2>
    <p class="text-muted">以下の内容で注文を確定します。ご確認ください。</p>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>商品名</th>
            <th class="text-center">数量</th>
            <th class="text-end">単価</th>
            <th class="text-end">小計</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.productName}"></td>
            <td class="text-center" th:text="${item.quantity}"></td>
            <td class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}"></td>
            <td class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(item.subtotal, 1, 'COMMA')}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="table-light">
            <td colspan="3" class="text-end fw-bold">合計</td>
            <td class="text-end fw-bold text-danger fs-5"
                th:text="'¥' + ${#numbers.formatInteger(totalPrice, 1, 'COMMA')}"></td>
        </tr>
        </tfoot>
    </table>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/cart}" class="btn btn-outline-secondary">← カートに戻る</a>
        <form th:action="@{/order/place}" method="post">
            <button type="submit" class="btn btn-danger btn-lg">注文を確定する</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
