<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>注文完了 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5 text-center" style="max-width: 600px;">
    <div class="card shadow-sm p-5">
        <div class="mb-4">
            <span style="font-size: 4rem;">✅</span>
        </div>
        <h2 class="mb-3">ご注文ありがとうございます！</h2>
        <p class="text-muted">注文が正常に完了しました。</p>

        <table class="table table-borderless mt-3">
            <tr>
                <th class="text-end">注文番号</th>
                <td class="text-start" th:text="'#' + ${order.id}"></td>
            </tr>
            <tr>
                <th class="text-end">合計金額</th>
                <td class="text-start text-danger fw-bold"
                    th:text="'¥' + ${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')}"></td>
            </tr>
            <tr>
                <th class="text-end">ステータス</th>
                <td class="text-start">
                    <span class="badge bg-warning text-dark" th:text="${order.status}"></span>
                </td>
            </tr>
        </table>

        <div class="d-grid gap-2 mt-4">
            <a th:href="@{/order/history}" class="btn btn-outline-primary">注文履歴を見る</a>
            <a th:href="@{/products}" class="btn btn-primary">買い物を続ける</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
