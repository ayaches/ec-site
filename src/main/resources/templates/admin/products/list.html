<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>商品管理 | 管理画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>商品管理</h2>
        <a th:href="@{/admin/products/new}" class="btn btn-success">＋ 商品を追加</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
        <p class="text-muted">登録されている商品がありません。</p>
    </div>

    <table th:unless="${#lists.isEmpty(products)}" class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th style="width: 60px;">ID</th>
            <th>商品名</th>
            <th class="text-end">価格</th>
            <th class="text-center">在庫</th>
            <th style="width: 160px;" class="text-center">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}"></td>
            <td class="text-center">
          <span th:text="${product.stock}"
                th:classappend="${product.stock == 0} ? 'text-danger fw-bold' : ''"></span>
            </td>
            <td class="text-center">
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                   class="btn btn-warning btn-sm me-1">編集</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('本当に削除しますか？')">
                    <button type="submit" class="btn btn-danger btn-sm">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
