<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' | ECサイト'">商品詳細 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/products}">商品一覧</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-5">
            <img th:if="${product.imageUrl != null}"
                 th:src="@{${product.imageUrl}}"
                 class="img-fluid rounded shadow"
                 alt="商品画像">
            <div th:unless="${product.imageUrl != null}"
                 class="bg-light rounded d-flex align-items-center justify-content-center"
                 style="height: 350px;">
                <span class="text-muted fs-4">No Image</span>
            </div>
        </div>

        <div class="col-md-7">
            <h2 th:text="${product.name}"></h2>
            <p class="text-danger fs-3 fw-bold"
               th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}"></p>
            <p class="text-muted" th:text="'在庫: ' + ${product.stock} + '点'"></p>
            <hr>
            <p th:text="${product.description}"></p>
            <hr>

            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <label for="quantity" class="form-label mb-0">数量：</label>
                        <input type="number" id="quantity" name="quantity"
                               class="form-control" style="width: 80px;"
                               value="1" min="1" th:max="${product.stock}">
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100"
                            th:disabled="${product.stock == 0}">
                        <span th:if="${product.stock > 0}">カートに追加</span>
                        <span th:unless="${product.stock > 0}">在庫切れ</span>
                    </button>
                </form>
            </div>

            <div sec:authorize="!isAuthenticated()" class="mt-3">
                <a th:href="@{/auth/login}" class="btn btn-outline-primary btn-lg w-100">
                    ログインしてカートに追加
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
