<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>商品一覧 | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <h2 class="mb-4">商品一覧</h2>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
        <p class="text-muted">現在、販売中の商品はありません。</p>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:if="${product.imageUrl != null}"
                     th:src="@{${product.imageUrl}}"
                     class="card-img-top"
                     alt="商品画像"
                     style="height: 200px; object-fit: cover;">
                <div th:unless="${product.imageUrl != null}"
                     class="card-img-top bg-light d-flex align-items-center justify-content-center"
                     style="height: 200px;">
                    <span class="text-muted">No Image</span>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text text-danger fw-bold"
                       th:text="'¥' + ${#numbers.formatInteger(product.price, 1, 'COMMA')}"></p>
                    <p class="card-text">
                        <small class="text-muted"
                               th:text="'在庫: ' + ${product.stock} + '点'"></small>
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/products/{id}(id=${product.id})}"
                       class="btn btn-primary w-100">詳細を見る</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
