<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>カート | ECサイト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <h2 class="mb-4">ショッピングカート</h2>

    <div th:if="${#lists.isEmpty(items)}" class="text-center py-5">
        <p class="text-muted fs-5">カートに商品がありません。</p>
        <a th:href="@{/products}" class="btn btn-primary">商品一覧へ</a>
    </div>

    <div th:unless="${#lists.isEmpty(items)}">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>商品名</th>
                <th class="text-end">単価</th>
                <th style="width: 140px;" class="text-center">数量</th>
                <th class="text-end">小計</th>
                <th style="width: 80px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.productName}"></td>
                <td class="text-end"
                    th:text="'¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}"></td>
                <td class="text-center">
                    <form th:action="@{/cart/update}" method="post"
                          class="d-flex align-items-center justify-content-center gap-1">
                        <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                        <input type="number" name="quantity"
                               class="form-control form-control-sm text-center"
                               style="width: 70px;"
                               th:value="${item.quantity}" min="0">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">更新</button>
                    </form>
                </td>
                <td class="text-end fw-bold"
                    th:text="'¥' + ${#numbers.formatInteger(item.subtotal, 1, 'COMMA')}"></td>
                <td class="text-center">
                    <form th:action="@{/cart/remove/{id}(id=${item.cartItemId})}" method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="table-light">
                <td colspan="3" class="text-end fw-bold">合計</td>
                <td class="text-end fw-bold text-danger fs-5"
                    th:text="'¥' + ${#numbers.formatInteger(totalPrice, 1, 'COMMA')}"></td>
                <td></td>
            </tr>
            </tfoot>
        </table>

        <div class="d-flex justify-content-between mt-3">
            <a th:href="@{/products}" class="btn btn-outline-secondary">買い物を続ける</a>
            <a th:href="@{/order/confirm}" class="btn btn-danger btn-lg">注文確認へ →</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
